[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilight-hdrvdp3"
version = "3.0.7.post1"
description = "Pinned JPEG AI HDR-VDP3 Python port with modern NumPy/SciPy compatibility"
requires-python = ">=3.10"
readme = "README.md"
license-files = ["UPSTREAM_NOTICES.md"]
dependencies = ["numpy>=1.24", "scipy>=1.12"]

[tool.setuptools]
packages = ["VDP3"]

[tool.setuptools.package-data]
VDP3 = ["*.csv", "*.txt", "*.json"]
